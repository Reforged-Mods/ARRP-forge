plugins {
    id 'org.relativitymc.neo-loom-remap' version "1.18-SNAPSHOT"
    id 'maven-publish'
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

base {
    archivesName = "${project.archives_base_name}"
}
version = project.mod_version
group = project.maven_group

def isCI = System.getenv("CI")

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        it.mappings "net.fabricmc:yarn:${project.minecraft_version}+${project.yarn_mappings}:v2"
        it.mappings "dev.architectury:yarn-mappings-patch-neoforge:1.21+build.4"
    }
    forgeUserdev "net.neoforged:neoforge:${project.neoforge_version}:userdev"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}


tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}" }
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "arrp-neoforge"
            from(components.java)
        }
    }
    // select the repositories you want to publish to
    repositories {
        if (isCI) {
            maven {
                url System.getenv("local_maven_url")
            }
        } else {
            mavenLocal()
        }
    }
}
tasks.withType(AbstractTestTask).configureEach {
    failOnNoDiscoveredTests = false
}
